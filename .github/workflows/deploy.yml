name: Build, validate and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      # Deploys only when the repo has a CLOUDFLARE_API_TOKEN secret (not set yet; see README).
      - name: Apply D1 migrations and deploy to workers.dev
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c54b2aac75854ed1ee968d78ace982c3
        run: |
          npx wrangler d1 migrations apply infyvision-enquiries --remote
          npx wrangler deploy
      - name: Deploy skipped
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "No CLOUDFLARE_API_TOKEN secret; build and validation only."
